<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mi Terreno</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;background:#000}
  #map{position:fixed;inset:0;z-index:0}
  /* TOP BAR */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:500;background:rgba(0,0,0,0.65);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:12px 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.1)}
  .topbar h1{font-size:17px;font-weight:700;color:#fff;letter-spacing:-0.3px}
  .topbar span{font-size:13px;color:rgba(255,255,255,0.6)}
  /* BOTTOM NAV */
  .bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:500;background:rgba(0,0,0,0.75);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;border-top:1px solid rgba(255,255,255,0.1);padding-bottom:env(safe-area-inset-bottom)}
  .navbtn{flex:1;padding:12px 8px 10px;background:none;border:none;color:rgba(255,255,255,0.5);font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit}
  .navbtn .icon{font-size:22px;line-height:1}
  .navbtn.active{color:#4cd97b}
  /* FAB */
  .fab{position:fixed;right:16px;bottom:80px;z-index:501;width:52px;height:52px;border-radius:50%;background:#4cd97b;border:none;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(76,217,123,0.5);color:#000}
  .fab:active{transform:scale(0.93)}
  /* LAYER TOGGLE */
  .layer-toggle{position:fixed;top:60px;right:12px;z-index:499;display:flex;flex-direction:column;gap:6px}
  .layer-btn{width:38px;height:38px;border-radius:10px;background:rgba(0,0,0,0.65);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .layer-btn.active{background:rgba(76,217,123,0.3);border-color:#4cd97b}
  /* PANELS */
  .panel{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,0.5);display:none;align-items:flex-end}
  .panel.open{display:flex}
  .panel-inner{background:#1c1c1e;border-radius:24px 24px 0 0;width:100%;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto}
  .panel-handle{width:36px;height:4px;background:rgba(255,255,255,0.2);border-radius:2px;margin:0 auto 16px}
  .panel-title{font-size:17px;font-weight:700;color:#fff;margin-bottom:16px}
  /* FORM */
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:rgba(255,255,255,0.5);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.5px;font-weight:600}
  .field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1px solid rgba(255,255,255,0.12);border-radius:12px;font-size:15px;background:#2c2c2e;color:#fff;font-family:inherit;-webkit-appearance:none}
  .field textarea{height:75px;resize:none}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#4cd97b}
  .field select option{background:#2c2c2e}
  .btn-row{display:flex;gap:10px;margin-top:6px}
  .btn{flex:1;padding:14px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;border:none}
  .btn.cancel{background:#3a3a3c;color:#fff}
  .btn.save{background:#4cd97b;color:#000}
  .btn:active{opacity:0.8}
  /* ZONES LIST */
  .zones-panel{position:fixed;inset:0;top:53px;bottom:68px;z-index:400;background:#000;display:none;overflow-y:auto;padding:12px 16px}
  .zones-panel.open{display:block}
  .zone-card{background:#1c1c1e;border-radius:16px;padding:14px 16px;margin-bottom:10px}
  .zone-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .zname{font-size:15px;font-weight:600;color:#fff;display:flex;align-items:center;gap:8px}
  .zdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .ztag{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;margin-top:4px}
  .znote{font-size:13px;color:rgba(255,255,255,0.5);margin-top:5px}
  .zcoords{font-size:11px;color:rgba(255,255,255,0.3);margin-top:4px;font-family:monospace}
  .zdel{background:none;border:none;color:rgba(255,255,255,0.25);font-size:22px;cursor:pointer;padding:2px 6px}
  .zdel:active{color:#ff453a}
  /* SUMMARY */
  .summary-panel{position:fixed;inset:0;top:53px;bottom:68px;z-index:400;background:#000;display:none;overflow-y:auto;padding:12px 16px}
  .summary-panel.open{display:block}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .stat{background:#1c1c1e;border-radius:14px;padding:14px 16px}
  .stat-lbl{font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:2px}
  .stat-val{font-size:30px;font-weight:700;color:#fff}
  .spanel{background:#1c1c1e;border-radius:14px;padding:16px;margin-bottom:12px}
  .spanel-title{font-size:13px;font-weight:600;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px}
  .bar-row{margin-bottom:10px}
  .bar-lbl{display:flex;justify-content:space-between;font-size:13px;color:rgba(255,255,255,0.7);margin-bottom:4px}
  .bar-bg{height:6px;background:rgba(255,255,255,0.08);border-radius:3px}
  .bar-fill{height:6px;border-radius:3px;transition:width 0.5s}
  /* EMPTY */
  .empty{text-align:center;padding:3rem 1rem;color:rgba(255,255,255,0.3)}
  .empty-icon{font-size:50px;margin-bottom:10px}
  /* TOAST */
  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;font-weight:500;opacity:0;transition:opacity 0.3s;z-index:999;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1}
  /* GPS BTN */
  .gps-btn{position:fixed;left:16px;bottom:80px;z-index:501;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,0.65);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.2);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff}
  .gps-btn:active{background:rgba(76,217,123,0.3)}
  .leaflet-control-attribution{font-size:9px!important;background:rgba(0,0,0,0.5)!important;color:rgba(255,255,255,0.4)!important}
  .leaflet-control-attribution a{color:rgba(255,255,255,0.4)!important}
</style>
</head>
<body>

<div id="map"></div>

<!-- TOP BAR -->
<div class="topbar">
  <h1>🌿 Mi Terreno</h1>
  <span id="zone-count">0 zonas</span>
</div>

<!-- LAYER BUTTONS -->
<div class="layer-toggle">
  <button class="layer-btn active" id="btn-sat" onclick="setLayer('sat')" title="Satélite">🛰</button>
  <button class="layer-btn" id="btn-map" onclick="setLayer('map')" title="Mapa">🗺</button>
</div>

<!-- GPS BUTTON -->
<button class="gps-btn" onclick="goToMyLocation()" title="Mi ubicación">📍</button>

<!-- FAB: añadir zona -->
<button class="fab" id="fab" onclick="startAddZone()" title="Añadir zona">＋</button>

<!-- BOTTOM NAV -->
<div class="bottomnav">
  <button class="navbtn active" id="nav-mapa" onclick="showSection('mapa')"><span class="icon">🗺</span>Mapa</button>
  <button class="navbtn" id="nav-zonas" onclick="showSection('zonas')"><span class="icon">📋</span>Zonas</button>
  <button class="navbtn" id="nav-resumen" onclick="showSection('resumen')"><span class="icon">📊</span>Resumen</button>
</div>

<!-- ZONES LIST PANEL -->
<div class="zones-panel" id="zones-panel">
  <div id="zones-list"></div>
</div>

<!-- SUMMARY PANEL -->
<div class="summary-panel" id="summary-panel">
  <div class="stat-grid">
    <div class="stat"><div class="stat-lbl">Zonas registradas</div><div class="stat-val" id="s-total">0</div></div>
    <div class="stat"><div class="stat-lbl">Factores distintos</div><div class="stat-val" id="s-factors">0</div></div>
  </div>
  <div class="spanel">
    <div class="spanel-title">Distribución por factor</div>
    <div id="factor-bars"><p style="color:rgba(255,255,255,0.3);font-size:13px">Sin datos aún</p></div>
  </div>
</div>

<!-- FORM PANEL -->
<div class="panel" id="form-panel">
  <div class="panel-inner">
    <div class="panel-handle"></div>
    <div class="panel-title">📍 Nueva zona</div>
    <div class="field"><label>Nombre de la zona</label><input type="text" id="f-name" placeholder="Ej: Bajo el algarrobo grande"></div>
    <div class="field"><label>Factor principal</label>
      <select id="f-factor">
        <option value="humedad">💧 Humedad</option>
        <option value="viento">💨 Viento</option>
        <option value="tierra">🪨 Tipo de tierra</option>
        <option value="luz">☀️ Luz solar</option>
        <option value="arboles">🌳 Árboles / Vegetación</option>
        <option value="otro">📝 Otro</option>
      </select>
    </div>
    <div class="field"><label>Descripción del factor</label><input type="text" id="f-value" placeholder="Ej: Alta, Arcillosa, Mucho viento..."></div>
    <div class="field"><label>Notas adicionales</label><textarea id="f-notes" placeholder="Estado del árbol, observaciones..."></textarea></div>
    <div class="btn-row">
      <button class="btn cancel" onclick="cancelForm()">Cancelar</button>
      <button class="btn save" onclick="saveZone()">✓ Guardar zona</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const COLORS=['#4cd97b','#ff6b35','#4da6ff','#ffd60a','#bf5af2','#ff375f','#32d74b','#ff9f0a'];
const FC={humedad:'#4da6ff',viento:'#4cd97b',tierra:'#ff9f0a',luz:'#ffd60a',arboles:'#32d74b',otro:'#bf5af2'};
const FL={humedad:'Humedad',viento:'Viento',tierra:'Tierra',luz:'Luz solar',arboles:'Árboles',otro:'Otro'};
const FI={humedad:'💧',viento:'💨',tierra:'🪨',luz:'☀️',arboles:'🌳',otro:'📝'};

let zones=[];
try{zones=JSON.parse(localStorage.getItem('terreno_v3')||'[]')}catch(e){}
let pendingLatLng=null, map, markers=[], tempMarker=null;
let satLayer, mapLayer, currentLayer='sat';
let addingZone=false, currentSection='mapa';

function initMap(){
  map=L.map('map',{zoomControl:false,attributionControl:true}).setView([39.4835,2.8897],17);

  satLayer=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{
    attribution:'Imagery © Esri',maxZoom:19
  });
  mapLayer=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© OpenStreetMap',maxZoom:19
  });
  satLayer.addTo(map);

  L.control.zoom({position:'topright'}).addTo(map);

  map.on('click',function(e){
    if(!addingZone) return;
    pendingLatLng=e.latlng;
    if(tempMarker) map.removeLayer(tempMarker);
    tempMarker=L.circleMarker(e.latlng,{radius:14,color:'#4cd97b',fillColor:'#4cd97b',fillOpacity:0.25,weight:2.5,dashArray:'6'}).addTo(map);
    document.getElementById('form-panel').classList.add('open');
    addingZone=false;
    document.getElementById('fab').style.background='#4cd97b';
    document.getElementById('fab').textContent='＋';
    setTimeout(()=>document.getElementById('f-name').focus(),200);
  });
  renderMarkers();
  updateCount();
}

function setLayer(l){
  if(l==='sat'){
    if(map.hasLayer(mapLayer)) map.removeLayer(mapLayer);
    if(!map.hasLayer(satLayer)) satLayer.addTo(map);
    document.getElementById('btn-sat').classList.add('active');
    document.getElementById('btn-map').classList.remove('active');
  } else {
    if(map.hasLayer(satLayer)) map.removeLayer(satLayer);
    if(!map.hasLayer(mapLayer)) mapLayer.addTo(map);
    document.getElementById('btn-map').classList.add('active');
    document.getElementById('btn-sat').classList.remove('active');
  }
  currentLayer=l;
}

function startAddZone(){
  if(currentSection!=='mapa') showSection('mapa');
  addingZone=!addingZone;
  const fab=document.getElementById('fab');
  if(addingZone){
    fab.style.background='#ff453a';
    fab.textContent='✕';
    showToast('Toca el mapa para marcar la zona');
  } else {
    fab.style.background='#4cd97b';
    fab.textContent='＋';
    if(tempMarker){map.removeLayer(tempMarker);tempMarker=null;}
  }
}

function cancelForm(){
  document.getElementById('form-panel').classList.remove('open');
  if(tempMarker){map.removeLayer(tempMarker);tempMarker=null;}
  addingZone=false;
  document.getElementById('fab').style.background='#4cd97b';
  document.getElementById('fab').textContent='＋';
}

function saveZone(){
  const name=document.getElementById('f-name').value.trim();
  if(!name){document.getElementById('f-name').focus();return;}
  if(!pendingLatLng) return;
  zones.push({
    id:Date.now(),name,
    factor:document.getElementById('f-factor').value,
    value:document.getElementById('f-value').value.trim(),
    notes:document.getElementById('f-notes').value.trim(),
    lat:pendingLatLng.lat,lng:pendingLatLng.lng,
    date:new Date().toLocaleDateString('es-ES')
  });
  saveData();
  document.getElementById('form-panel').classList.remove('open');
  ['f-name','f-value','f-notes'].forEach(id=>document.getElementById(id).value='');
  if(tempMarker){map.removeLayer(tempMarker);tempMarker=null;}
  renderMarkers();
  showToast('Zona guardada ✓');
}

function deleteZone(id){
  if(!confirm('¿Eliminar esta zona?')) return;
  zones=zones.filter(z=>z.id!==id);
  saveData();renderList();renderMarkers();
}

function saveData(){
  try{localStorage.setItem('terreno_v3',JSON.stringify(zones));}catch(e){}
  updateCount();
}

function updateCount(){
  document.getElementById('zone-count').textContent=zones.length+(zones.length===1?' zona':' zonas');
}

function renderMarkers(){
  markers.forEach(m=>map.removeLayer(m));
  markers=[];
  zones.forEach((z,i)=>{
    const c=COLORS[i%COLORS.length];
    const m=L.circleMarker([z.lat,z.lng],{radius:14,color:c,fillColor:c,fillOpacity:0.35,weight:2.5}).addTo(map);
    m.bindPopup(`<div style="font-size:14px;font-weight:700;margin-bottom:3px">${z.name}</div><div style="font-size:12px;color:#aaa">${FI[z.factor]||''} ${FL[z.factor]||z.factor}${z.value?': '+z.value:''}</div>${z.notes?'<div style="font-size:11px;color:#888;margin-top:3px">'+z.notes+'</div>':''}`);
    markers.push(m);
  });
  updateCount();
}

function goToMyLocation(){
  if(!navigator.geolocation){alert('Geolocalización no disponible en este navegador');return;}
  showToast('Buscando ubicación GPS...');
  navigator.geolocation.getCurrentPosition(pos=>{
    const ll=[pos.coords.latitude,pos.coords.longitude];
    map.setView(ll,18);
    L.circleMarker(ll,{radius:10,color:'#ff6b35',fillColor:'#ff6b35',fillOpacity:0.9,weight:2.5}).addTo(map).bindPopup('<b>Tu ubicación actual</b>').openPopup();
    showToast('¡Ubicación encontrada! ✓');
  },err=>{
    alert('No se pudo obtener ubicación.\n\nEn iPhone: Ajustes → Privacidad → Localización → Safari → Permitir');
  },{enableHighAccuracy:true,timeout:10000});
}

function renderList(){
  const el=document.getElementById('zones-list');
  if(!zones.length){
    el.innerHTML='<div class="empty"><div class="empty-icon">🗺</div>Sin zonas todavía.<br>Ve al mapa, pulsa ＋ y toca un punto.</div>';
    return;
  }
  el.innerHTML=zones.map((z,i)=>`
    <div class="zone-card">
      <div class="zone-header">
        <div class="zname"><span class="zdot" style="background:${COLORS[i%COLORS.length]}"></span>${z.name}</div>
        <button class="zdel" onclick="deleteZone(${z.id})">×</button>
      </div>
      <span class="ztag" style="background:${FC[z.factor]||'#888'}25;color:${FC[z.factor]||'#aaa'}">${FI[z.factor]||''} ${FL[z.factor]||z.factor}${z.value?': '+z.value:''}</span>
      ${z.notes?`<div class="znote">${z.notes}</div>`:''}
      <div class="zcoords">${z.lat.toFixed(5)}, ${z.lng.toFixed(5)} · ${z.date}</div>
    </div>
  `).join('');
}

function renderSummary(){
  document.getElementById('s-total').textContent=zones.length;
  const factors=[...new Set(zones.map(z=>z.factor))];
  document.getElementById('s-factors').textContent=factors.length;
  const counts={};
  zones.forEach(z=>{counts[z.factor]=(counts[z.factor]||0)+1;});
  const el=document.getElementById('factor-bars');
  if(!zones.length){el.innerHTML='<p style="color:rgba(255,255,255,0.3);font-size:13px">Sin datos aún</p>';return;}
  el.innerHTML=Object.entries(counts).map(([f,c])=>{
    const pct=Math.round((c/zones.length)*100);
    return `<div class="bar-row">
      <div class="bar-lbl"><span>${FI[f]||''} ${FL[f]||f}</span><span>${c} zona${c>1?'s':''}</span></div>
      <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${FC[f]||'#888'}"></div></div>
    </div>`;
  }).join('');
}

function showSection(s){
  currentSection=s;
  ['mapa','zonas','resumen'].forEach((sec,i)=>{
    document.querySelectorAll('.navbtn')[i].classList.toggle('active',sec===s);
  });
  document.getElementById('zones-panel').classList.toggle('open',s==='zonas');
  document.getElementById('summary-panel').classList.toggle('open',s==='resumen');
  document.getElementById('fab').style.display=s==='mapa'?'flex':'none';
  document.querySelector('.gps-btn').style.display=s==='mapa'?'flex':'none';
  document.querySelector('.layer-toggle').style.display=s==='mapa'?'flex':'none';
  if(s==='zonas') renderList();
  if(s==='resumen') renderSummary();
  if(s==='mapa') setTimeout(()=>map&&map.invalidateSize(),100);
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

document.addEventListener('DOMContentLoaded',initMap);
</script>
</body>
</html>
